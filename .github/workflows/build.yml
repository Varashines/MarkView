name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0)'
        required: false
        default: '1.0.0'
      publish:
        description: 'Publish a GitHub release (creates the tag if missing)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MarkView
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project mdViewer.xcodeproj

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project mdViewer.xcodeproj -scheme mdViewer

      - name: Build app
        run: |
          xcodebuild \
            -project mdViewer.xcodeproj \
            -scheme mdViewer \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Verify bundled resources
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [[ -z "$APP" ]]; then
            echo "No .app bundle found"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          grep -q "Pele 1.10.0" "$APP/Contents/Resources/pele.global.js"
          test -f "$APP/Contents/Resources/katex.min.js"
          test -f "$APP/Contents/Resources/markdown.css"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Ad-hoc sign and verify
        run: |
          codesign --force --deep --sign - \
            --entitlements mdViewer/mdViewer.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package artifacts
        run: |
          ditto -c -k --keepParent "$APP" MarkView.zip
          hdiutil create -volname "MarkView" -srcfolder "$APP" -ov -format UDZO MarkView.dmg
          ls -lh MarkView.zip MarkView.dmg

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkView-${{ steps.version.outputs.value }}
          path: |
            MarkView.zip
            MarkView.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MarkView ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            MarkView.zip
            MarkView.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
