name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0)'
        required: false
        default: '1.0.0'
      publish:
        description: 'Publish a GitHub release (creates the tag if missing)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MarkView
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project mdViewer.xcodeproj

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project mdViewer.xcodeproj -scheme mdViewer

      - name: Build app
        run: |
          xcodebuild \
            -project mdViewer.xcodeproj \
            -scheme mdViewer \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Verify bundled resources
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [[ -z "$APP" ]]; then
            echo "No .app bundle found"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          grep -q "Pele 1.10.0" "$APP/Contents/Resources/pele.global.js"
          test -f "$APP/Contents/Resources/katex.min.js"
          test -f "$APP/Contents/Resources/markdown.css"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Generate and install app icon
        run: |
          swift generate_icon.swift
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$APP/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon.icns" "$APP/Contents/Info.plist"

      - name: Ad-hoc sign and verify
        run: |
          codesign --force --deep --sign - \
            --entitlements mdViewer/mdViewer.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package DMG
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          STAGE="dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create -volname "MarkView" -srcfolder "$STAGE" -ov -format UDRW -fs HFS+ MarkView-rw.dmg
          MOUNT_DIR="/Volumes/MarkView"
          hdiutil attach MarkView-rw.dmg -nobrowse -readwrite -mountpoint "$MOUNT_DIR"
          cp AppIcon.icns "$MOUNT_DIR/.VolumeIcon.icns"
          if command -v SetFile >/dev/null 2>&1; then
            SetFile -a C "$MOUNT_DIR"
          fi
          sync
          hdiutil detach "$MOUNT_DIR" -quiet

          hdiutil convert MarkView-rw.dmg -format UDZO -imagekey zlib-level=9 -o "MarkView-$VERSION.dmg"
          rm -f MarkView-rw.dmg
          ls -lh "MarkView-$VERSION.dmg"

      - name: Verify DMG
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          DMG="MarkView-$VERSION.dmg"
          hdiutil verify "$DMG"
          MOUNT_DIR="/Volumes/MarkView"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          test -d "$MOUNT_DIR/MarkView.app"
          test -L "$MOUNT_DIR/Applications"
          test -f "$MOUNT_DIR/.VolumeIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$MOUNT_DIR/MarkView.app/Contents/Info.plist"
          hdiutil detach "$MOUNT_DIR" -quiet

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkView-${{ steps.version.outputs.value }}
          path: MarkView-${{ steps.version.outputs.value }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MarkView ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: MarkView-${{ steps.version.outputs.value }}.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
